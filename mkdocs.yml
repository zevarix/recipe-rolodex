site_name: Recipe Rolodex
site_url: https://zevarix.github.io/recipe-rolodex/
site_description: Real family recipes, saved for the next good dinner.
repo_url: https://github.com/zevarix/recipe-rolodex
repo_name: zevarix/recipe-rolodex
copyright: '© 2026 Zevarix / Recipe Rolodex · Original writing CC BY 4.0 · Code MIT · <a href="https://zevarix.github.io/recipe-rolodex/licensing/">Licensing & attribution</a>'
docs_dir: docs
site_dir: site
use_directory_urls: true

nav:
  - Home: index.md
  - Browse recipes: recipes/index.md
  - Dinner plans: dinners/index.md
  - About: about.md
  - Licensing & attribution: licensing.md

theme:
  name: material
  variant: modern
  font: false
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - tags:
      tags_hierarchy: true

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences

extra_css:
  - stylesheets/recipes.css

extra_javascript:
  - javascripts/recipe-tools.js
