site_name: Recipe Rolodex
site_url: https://zevarix.github.io/recipe-rolodex/
site_description: Real family recipes, saved for the next good dinner.
repo_url: https://github.com/zevarix/recipe-rolodex
repo_name: zevarix/recipe-rolodex
copyright: '© 2026 Zevarix / Recipe Rolodex · Original writing CC BY 4.0 · Code MIT · <a href="https://zevarix.github.io/recipe-rolodex/licensing/">Licensing & attribution</a>'
docs_dir: docs
site_dir: site
# Public GitHub sources are visible to everyone; local drafts are also gitignored.
# Drafts are included by 'zensical serve' but not in published builds.
draft_docs: |
  /drafts/
  *.draft.md
use_directory_urls: true

nav:
  - Home: index.md
  - Recipes:
      - Browse recipes: recipes/index.md
      - By course: recipes/by-course.md
      - By mealtime: recipes/by-meal.md
      - By ingredient: recipes/by-ingredient.md
      - By style: recipes/by-style.md
  - Dinner plans:
      - Browse dinner plans: dinners/index.md
  - About: about.md
  - Licensing & attribution: licensing.md

theme:
  name: material
  variant: modern
  font: false
  icon:
    tag:
      default: lucide/tag
      course: lucide/utensils
      mains: lucide/cooking-pot
      sides: lucide/salad
      desserts: lucide/cake-slice
      snacks: lucide/cookie
      breakfast: lucide/sunrise
      lunch: lucide/sun
      dinner: lucide/moon
      ingredient: lucide/carrot
      seafood: lucide/fish
      bread: lucide/wheat
      meal: lucide/clock
      style: lucide/sparkles
      pesto: lucide/leaf
      plans: lucide/clipboard-list
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - tags:
      tags_hierarchy: true
      listings_toc: false

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences

# Tag icons are presentational; the taxonomy and labels remain native Zensical tags.
extra:
  tags:
    Course: course
    Course/Mains: mains
    Course/Sides: sides
    Course/Desserts: desserts
    Course/Snacks: snacks
    Meal: meal
    Meal/Breakfast: breakfast
    Meal/Brunch: breakfast
    Meal/Lunch: lunch
    Meal/Dinner: dinner
    Meal/Anytime: meal
    Ingredient: ingredient
    Ingredient/Seafood: seafood
    Ingredient/Bread: bread
    Style: style
    Style/Pesto: pesto
    Dinner Plans: plans

extra_css:
  - stylesheets/recipes.css

extra_javascript:
  - javascripts/recipe-tools.js
